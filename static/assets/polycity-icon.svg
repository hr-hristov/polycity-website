<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Polycity Sofia cathedral model</title>
  <defs>
    <!--
      Alexander Nevsky Cathedral rising from a block of the city, drawn the way
      the homepage draws its city: an isometric model with lit edges and pale
      faces, the Palace of Culture's sun on the left block, the theatre's
      columns on the right, and a route with four stops through the streets.
      Codex drew it on 24 Sep 2026 as "Cathedral Circuit". The edges run the
      brand colours dark enough to read on a paper page; the copy for the navy
      end of the homepage is polycity-icon-light.svg.
    -->
    <linearGradient id="f3-p-edge" x1="5" y1="24" x2="59" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490"/>
      <stop offset=".34" stop-color="#2456a8"/>
      <stop offset=".67" stop-color="#7b3fa0"/>
      <stop offset=".86" stop-color="#c23d7c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="f3-p-dome" x1="22" y1="8" x2="43" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4f8fa"/>
      <stop offset=".5" stop-color="#d5dcff"/>
      <stop offset="1" stop-color="#ecd3f0"/>
    </linearGradient>
    <linearGradient id="f3-p-block" x1="8" y1="32" x2="57" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8f4f7"/>
      <stop offset=".5" stop-color="#dce6fb"/>
      <stop offset="1" stop-color="#f7dce9"/>
    </linearGradient>
    <!-- Every edge of the model, drawn twice below: a soft glow, then the line. -->
    <g id="f3-p-wire" fill="none">
      <path d="M4 38 30.5 22.5 60 38 33 54.8 4 38Zm0 0v4.2L33 59.5 60 42.2V38M33 54.8v4.7"/>
      <path d="M8 40.5 12 37.8v-1.6l6-3.2 6 3.2v1.6l4 2.7-10 5.8-10-5.8Zm0 0v7.7l10 6 10-6.1v-7.6M18 46.3v7.9M10.8 43.8l7.2 4.3 7.2-4.3"/>
      <path d="m13.4 45.3 3 1.8v3.7l-3-1.8Zm7.1 2.7 3-1.8v3.7l-3 1.8Z"/>
      <path d="M39 39 49 33.2l10 5.3-10 5.7L39 39Zm0 0v7.8l10 5.7 10-5.8v-8.2M49 44.2v8.3M42.8 38.5 49 35l6.2 3.3-6.2 3.5-6.2-3.3Z"/>
      <path d="M51.1 43v6.8m3-8.5v6.8m3-8.5v6.8M49 48.2l10-5.8M40.8 44.2l8.2 4.6"/>
      <path d="M10.1 35.1 15.2 32l5.4 2.8-5.2 3.1-5.3-2.8Zm0 0v4.2l5.3 3.1 5.2-3.1v-4.5M15.4 37.9v4.5"/>
      <path d="m42.2 31.2 7-4.1 7 3.7-7 4.2-7-3.8Zm0 0v4.8l7 4 7-4.1v-5.1M49.2 35v5"/>
      <path d="M19.5 31.5 32 24.2l12.5 7.1L32 38.7l-12.5-7.2Zm0 0v8.7L32 47.5l12.5-7.4v-8.8M32 38.7v8.8M22.3 37.8 32 43.4l9.6-5.7"/>
      <path d="M21 23.5 31.8 17.4l10.8 6.1L32 29.5 21 23.5Zm0 0v6.2l11 6.2 10.6-6.1v-6.3M32 29.5v6.4"/>
      <path d="M20.8 23.5c1.2-8.1 5.2-14.9 11-18.1 5.8 3.2 9.8 10 11 18.1L32 29.5l-11.2-6ZM31.8 5.4c-1.8 6.6-1.7 14.8.2 24.1M31.8 5.4c4 5 6.6 11.3 7.4 20M23 17.2c5.8 2.8 11.8 4.5 17.5 4.8M31.8 2.2v3.2M30.4 3.4h2.8"/>
      <path d="M17.1 33.3c.4-3.8 1.8-6.8 4-8.3 2.2 1.6 3.7 4.6 4.1 8.4l-4 2.3-4.1-2.4ZM21.1 25v10.7M40 33.6c.4-3.8 1.9-6.8 4-8.3 2.2 1.6 3.7 4.6 4.1 8.4L44 36l-4-2.4ZM44 25.3V36"/>
      <path d="m24.2 29.8 2.2 1.2v3.2L24.2 33Zm13.2 1.2 2.2-1.2V33l-2.2 1.2Z"/>
    </g>
  </defs>

  <!-- The city block the landmarks stand on, and its streets. -->
  <path d="M4 38 30.5 22.5 60 38 33 54.8Z" fill="#edf8fb"/>
  <path d="M4 38 33 54.8v4.7L4 42.2Z" fill="#dbe9f3"/>
  <path d="M33 54.8 60 38v4.2L33 59.5Z" fill="#d5e3f1"/>

  <g fill="none" stroke="#d3eaf1" stroke-width="2.5" stroke-linecap="round">
    <path d="M8 40.3 35 55.2M15.5 33.2 43 48.8M23.3 28.1 51.7 43.7"/>
    <path d="M12.5 43.1 40 27.2M20 47.2 48.7 30.8M28.5 51.8 56 35.3"/>
  </g>
  <g fill="none" stroke="url(#f3-p-edge)" stroke-width=".42" opacity=".58" stroke-linecap="round">
    <path d="M8 40.3 35 55.2M15.5 33.2 43 48.8M23.3 28.1 51.7 43.7"/>
    <path d="M12.5 43.1 40 27.2M20 47.2 48.7 30.8M28.5 51.8 56 35.3"/>
  </g>

  <!-- Faces of the small blocks, the Palace of Culture with its sun, and the theatre. -->
  <path d="M10.1 35.1 15.4 37.9v4.5l-5.3-3.1Z" fill="#d9eff5"/>
  <path d="m15.4 37.9 5.2-3.1v4.5l-5.2 3.1Z" fill="#dfe4f8"/>
  <path d="m10.1 35.1 5.1-3.1 5.4 2.8-5.2 3.1Z" fill="#d2f2f6"/>

  <path d="M42.2 31.2 49.2 35v5l-7-4Z" fill="#dce6f8"/>
  <path d="m49.2 35 7-4.2v5.1l-7 4.1Z" fill="#efdced"/>
  <path d="m42.2 31.2 7-4.1 7 3.7-7 4.2Z" fill="#e4e1f8"/>

  <path d="M8 40.5 18 46.3v7.9l-10-6Z" fill="#d8eef5"/>
  <path d="m18 46.3 10-5.8v7.6l-10 6.1Z" fill="#dedff6"/>
  <path d="M8 40.5 12 37.8v-1.6l6-3.2 6 3.2v1.6l4 2.7-10 5.8Z" fill="url(#f3-p-block)"/>
  <circle cx="16.1" cy="47.3" r="1.25" fill="#febe11"/>

  <path d="M39 39 49 44.2v8.3l-10-5.7Z" fill="#eadff3"/>
  <path d="m49 44.2 10-5.7v8.2l-10 5.8Z" fill="#f7dce5"/>
  <path d="M39 39 49 33.2l10 5.3-10 5.7Z" fill="url(#f3-p-block)"/>
  <path d="M42.8 38.5 49 35l6.2 3.3-6.2 3.5Z" fill="#ffe8d1"/>

  <!-- The cathedral: its base, drum, main dome and the two side domes. -->
  <path d="M19.5 31.5 32 38.7v8.8l-12.5-7.3Z" fill="#d9edf6"/>
  <path d="m32 38.7 12.5-7.4v8.8L32 47.5Z" fill="#e5def7"/>
  <path d="M19.5 31.5 32 24.2l12.5 7.1L32 38.7Z" fill="url(#f3-p-block)"/>

  <path d="M21 23.5 32 29.5v6.4l-11-6.2Z" fill="#d5edf6"/>
  <path d="m32 29.5 10.6-6v6.3L32 35.9Z" fill="#ddd8f6"/>
  <path d="M20.8 23.5c1.2-8.1 5.2-14.9 11-18.1 5.8 3.2 9.8 10 11 18.1L32 29.5Z" fill="url(#f3-p-dome)"/>
  <path d="M31.8 5.4c5.8 3.2 9.8 10 11 18.1L32 29.5c-1.9-9.3-2-17.5-.2-24.1Z" fill="#cdbcf2" opacity=".45"/>
  <path d="M17.1 33.3c.4-3.8 1.8-6.8 4-8.3 2.2 1.6 3.7 4.6 4.1 8.4l-4 2.3Z" fill="url(#f3-p-dome)"/>
  <path d="M40 33.6c.4-3.8 1.9-6.8 4-8.3 2.2 1.6 3.7 4.6 4.1 8.4L44 36Z" fill="url(#f3-p-dome)"/>

  <!-- The route through the streets. -->
  <path d="M7 40.1 20 47.5 47 31.8 57 37.3" fill="none" stroke="#c23d7c" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>

  <use href="#f3-p-wire" stroke="#73c9dc" stroke-width="2.35" opacity=".15" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#f3-p-wire" stroke="url(#f3-p-edge)" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The route's stops, then the lit corners of the model. -->
  <g fill="#f6f7fb" stroke="#c23d7c" stroke-width=".62">
    <circle cx="7" cy="40.1" r=".82"/>
    <circle cx="20" cy="47.5" r=".82"/>
    <circle cx="47" cy="31.8" r=".82"/>
    <circle cx="57" cy="37.3" r=".82"/>
  </g>
  <g fill="#f6f7fb" stroke="url(#f3-p-edge)" stroke-width=".62">
    <circle cx="4" cy="38" r=".62"/>
    <circle cx="30.5" cy="22.5" r=".62"/>
    <circle cx="60" cy="38" r=".62"/>
    <circle cx="33" cy="54.8" r=".62"/>
    <circle cx="31.8" cy="5.4" r=".74"/>
    <circle cx="20.8" cy="23.5" r=".62"/>
    <circle cx="42.8" cy="23.5" r=".62"/>
    <circle cx="49" cy="33.2" r=".58"/>
  </g>
</svg>
