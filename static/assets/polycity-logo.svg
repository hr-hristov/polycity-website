<svg xmlns="http://www.w3.org/2000/svg" width="360" height="248" viewBox="0 0 360 248" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Polycity</title>
  <desc id="logo-description">A flat graphic skyline of Sofia's Palace of Culture, Alexander Nevsky Cathedral and Ivan Vazov Theatre. Clean silhouettes and transparent architectural cutouts carry the original rainbow palette above a flowing route, level base and navy Polycity wordmark.</desc>
  <defs>
    <linearGradient id="city-spectrum" x1="18" y1="0" x2="344" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ad6ed"/><stop offset=".23" stop-color="#049dd6"/><stop offset=".43" stop-color="#011573"/><stop offset=".62" stop-color="#57039b"/><stop offset=".76" stop-color="#ae157e"/><stop offset=".89" stop-color="#fd4b08"/><stop offset="1" stop-color="#febe11"/>
    </linearGradient>
    <mask id="skyline-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="196">
      <path fill="#fff" d="M0 0h360v196H0z"/>
      <!-- Horizontal courses and upright openings keep every landmark in elevation. -->
      <g fill="none" stroke="#000" stroke-width="3">
        <path d="M140 93h56M214 76h23"/>
        <path d="M110 135h21m75 0h23"/>
        <path d="M136 148c0-17 14-30 32-30s32 13 32 30"/>
        <path d="M266 139h62"/>
      </g>
      <g fill="#000">
        <!-- Tall facade slots flank NDK's broad central bay. -->
        <path d="M23 147h3v22h-3Zm7-3h3v25h-3Zm8-8h3v32h-3Zm8 2h3v29h-3Zm7-3h3v32h-3Zm31 0h3v32h-3Zm7 3h3v29h-3Zm8-2h3v33h-3Zm7 9h3v24h-3Z"/>
        <path d="M60 136h20v21H60ZM62 169h16v4H62Z"/>
        <path d="M217 68V57a3 3 0 0 1 6 0v11Zm11 0V57a3 3 0 0 1 6 0v11Z"/>
        <path d="M144 111v-8a3 3 0 0 1 6 0v8Zm14 0v-8a3 3 0 0 1 6 0v8Zm14 0v-8a3 3 0 0 1 6 0v8Zm14 0v-8a3 3 0 0 1 6 0v8Z"/>
        <path d="M112 158v-10a3 3 0 0 1 6 0v10Zm14 0v-10a3 3 0 0 1 6 0v10Zm78 0v-10a3 3 0 0 1 6 0v10Zm14 0v-10a3 3 0 0 1 6 0v10Z"/>
        <path d="M158 167v-13a10 10 0 0 1 20 0v13Z"/>
        <path d="m279 130 18-15 18 15ZM258 119h7v12h-7Zm70 0h7v12h-7Z"/>
        <path d="M274 145h5v27h-5Zm10 0h5v27h-5Zm10 0h5v27h-5Zm10 0h5v27h-5Zm10 0h5v27h-5Z"/>
      </g>
      <!-- The sun is cut back into the central plaque, keeping the mark flat. -->
      <g transform="translate(70 146.5)" fill="#fff" stroke="#fff" stroke-width="1.4">
        <circle r="3" stroke="none"/>
        <path d="M0-7v14M-7 0H7M-5-5 5 5M-5 5 5-5M-2.7-6.5 2.7 6.5M-6.5-2.7 6.5 2.7M-6.5 2.7 6.5-2.7M-2.7 6.5 2.7-6.5"/>
      </g>
      <path d="M18 176C46 176 56 162 80 166S127 185 153 176 186 161 210 165 265 183 292 173 322 167 344 175" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
      <g fill="#000"><circle cx="80" cy="166" r="4.5"/><circle cx="210" cy="165" r="4.5"/><circle cx="292" cy="173" r="4.5"/></g>
    </mask>
  </defs>
  <g id="flat-skyline" fill="url(#city-spectrum)" mask="url(#skyline-cutouts)">
    <path d="M18 174h326v13H18Z"/>
    <!-- NDK: one broad volume, angled shoulders, vertical panels and a sun plaque. -->
    <path id="palace-of-culture" d="M18 187v-43l16-5v-12h9v5l13-6h23l12 6v-5h9v12l12 5v43Z"/>
    <!-- The bell tower and cascading dome contours identify Alexander Nevsky. -->
    <g id="alexander-nevsky">
      <path d="M214 144V80h-4v-7h3V53h-3c0-11 5-20 15-24 10 4 15 13 15 24h-3v20h4v7h-4v64Z"/>
      <path d="M225 21v9m-4-6h8" fill="none" stroke="url(#city-spectrum)" stroke-width="2"/>
      <path d="M102 187v-44h4v-10c0-15 10-27 25-29v-4h7v-9h-4c0-18 14-31 34-34 20 3 35 16 35 34h-4v9h9v5c14 3 24 14 24 28v10h6v44Z"/>
      <path d="M168 48v10m-4-7h8" fill="none" stroke="url(#city-spectrum)" stroke-width="2"/>
    </g>
    <!-- The theatre reads through a flat pediment, paired pavilions and column gaps. -->
    <g id="ivan-vazov-theatre">
      <path d="M237 187v-53h17v-23h-3c0-7 4-12 11-15 7 3 11 8 11 15h-3v20l27-23 27 23v-20h-3c0-7 4-12 11-15 7 3 11 8 11 15h-3v23h4v53Z"/>
      <path d="M262 91v6m70-6v6" fill="none" stroke="url(#city-spectrum)" stroke-width="2.5"/>
    </g>
  </g>
  <!-- Outlined lettering stays identical without a font or network request. -->
  <g id="polycity-wordmark" fill="#000b2d" fill-rule="evenodd">
    <path d="M24 237v-30h15c9 0 14 4 14 11s-5 11-14 11h-8v8Zm7-14h8c5 0 7-2 7-5s-2-5-7-5h-8Z"/>
    <path d="M84 206c10 0 17 7 17 16s-7 16-17 16-17-7-17-16 7-16 17-16Zm0 7c-6 0-10 4-10 9s4 9 10 9 10-4 10-9-4-9-10-9Z"/>
    <path d="M117 207h7v23h18v7h-25Z"/>
    <path d="m153 207 8 0 9 12 9-12h8l-14 19v11h-7v-11Z"/>
    <path d="M215 206c6 0 10 2 14 6l-5 5c-3-3-5-4-9-4-6 0-10 4-10 9s4 9 10 9c4 0 6-1 9-4l5 5c-4 4-8 6-14 6-10 0-17-7-17-16s7-16 17-16Z"/>
    <path d="M244 207h7v30h-7Z"/>
    <path d="M269 207h29v7h-11v23h-7v-23h-11Z"/>
    <path d="m309 207 8 0 9 12 9-12h8l-14 19v11h-7v-11Z"/>
  </g>
</svg>
